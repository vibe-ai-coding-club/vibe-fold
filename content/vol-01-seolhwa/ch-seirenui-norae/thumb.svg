<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 297 420" width="297" height="420">
	<defs>
		<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#0a1024" />
			<stop offset="0.55" stop-color="#111d3a" />
			<stop offset="1" stop-color="#060a16" />
		</linearGradient>
		<radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
			<stop offset="0" stop-color="#e8b24c" stop-opacity="0.30" />
			<stop offset="1" stop-color="#e8b24c" stop-opacity="0" />
		</radialGradient>
	</defs>

	<rect width="297" height="420" fill="url(#sky)" />
	<rect width="297" height="420" fill="url(#glow)" />

	<!-- siren rocks -->
	<path d="M0 150 L34 128 L52 176 L78 158 L96 420 L0 420 Z" fill="#05080f" />
	<path d="M297 168 L262 142 L246 190 L218 172 L200 420 L297 420 Z" fill="#05080f" />

	<!-- siren silhouettes on the lips of the rock -->
	<circle cx="52" cy="166" r="7" fill="#e8b24c" opacity="0.75" />
	<circle cx="246" cy="180" r="7" fill="#e8b24c" opacity="0.75" />

	<!-- song rings -->
	<circle cx="52" cy="166" r="26" fill="none" stroke="#e8b24c" stroke-opacity="0.30" />
	<circle cx="52" cy="166" r="46" fill="none" stroke="#e8b24c" stroke-opacity="0.16" />
	<circle cx="246" cy="180" r="26" fill="none" stroke="#e8b24c" stroke-opacity="0.30" />
	<circle cx="246" cy="180" r="46" fill="none" stroke="#e8b24c" stroke-opacity="0.16" />

	<!-- sea -->
	<path d="M0 336 Q74 322 148 336 T297 336 L297 420 L0 420 Z" fill="#0b1730" />
	<path d="M0 356 Q74 344 148 356 T297 356 L297 420 L0 420 Z" fill="#081020" />

	<!-- deck + mast + bound figure -->
	<path d="M74 352 L223 352 L204 380 L93 380 Z" fill="#1c1409" />
	<rect x="145" y="188" width="7" height="164" fill="#2a1e0d" />
	<path d="M152 214 L152 300 L196 262 Z" fill="#141d33" opacity="0.85" />
	<g transform="rotate(-11 148 352)">
		<rect x="141" y="296" width="15" height="56" rx="7" fill="#c8b48a" />
		<circle cx="148" cy="288" r="11" fill="#d8c49a" />
		<rect x="136" y="312" width="25" height="4" fill="#8c6b3a" />
		<rect x="136" y="328" width="25" height="4" fill="#8c6b3a" />
	</g>

	<!-- notes in flight -->
	<g fill="#e8b24c">
		<g transform="translate(96 240) rotate(-14)">
			<ellipse cx="0" cy="0" rx="6" ry="4.4" />
			<rect x="4.4" y="-22" width="2.4" height="22" />
			<path d="M6.8 -22 q10 4 7 15 q1 -10 -7 -11 Z" />
		</g>
		<g transform="translate(206 214) rotate(12)" opacity="0.9">
			<ellipse cx="0" cy="0" rx="5.4" ry="4" />
			<rect x="4" y="-20" width="2.2" height="20" />
			<path d="M6.2 -20 q9 3.6 6.4 13.6 q0.9 -9 -6.4 -10 Z" />
		</g>
		<g transform="translate(176 300) rotate(-6)" opacity="0.72">
			<ellipse cx="0" cy="0" rx="4.6" ry="3.4" />
			<rect x="3.4" y="-17" width="2" height="17" />
			<path d="M5.4 -17 q7.6 3 5.4 11.6 q0.8 -7.6 -5.4 -8.6 Z" />
		</g>
	</g>
</svg>
