<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>세이렌의 노래</title>
		<style>
			html,
			body {
				margin: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: #060a16;
				touch-action: none;
				cursor: none;
			}
			canvas {
				display: block;
				width: 100%;
				height: 100%;
			}
			.caption {
				position: fixed;
				left: 8%;
				right: 8%;
				bottom: 22%;
				margin: 0;
				text-align: center;
				color: #e8d7ae;
				opacity: 0;
				transition: opacity 1.1s ease;
				pointer-events: none;
				font: 400 clamp(15px, 2.1vw, 21px) / 1.6 "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
				letter-spacing: 0.01em;
				text-shadow: 0 2px 18px rgba(0, 0, 0, 0.75);
			}
			.caption.is-on {
				opacity: 1;
			}
		</style>
	</head>
	<body>
		<canvas id="c"></canvas>
		<p class="caption" id="caption"></p>

		<script>
			const canvas = document.getElementById("c");
			const ctx = canvas.getContext("2d");
			const captionEl = document.getElementById("caption");

			const TAU = Math.PI * 2;
			const GOLD = "#e8b24c";

			// The site shell paints a fixed header over the top of this frame.
			// Keep anything readable below this band.
			const CHROME_PAD = 150;

			const STRAIT_SECONDS = 29;
			const MAX_LEAN = 0.95; // radians the rope allows, either side
			const ROPE_PULL = 3.4; // how hard the mast drags the body back to centre
			const LEAN_PUSH = 12; // how hard the pointer leans the body over
			const LEAN_DAMP = 0.88;
			const HIT_CHARM = 0.11; // nine notes before the rope gives
			const HIT_MERCY = 0.7; // seconds of grace after taking one
			const HEAD_HIT = 7; // forgiving — the drawn head is radius 15

			let W = 0;
			let H = 0;
			let deckY = 0;
			let bodyLen = 0;

			let time = 0;
			let last = 0;
			let phase = "intro"; // intro | run | lost | passed
			let elapsed = 0;
			let charm = 0; // 0 = clear headed, 1 = the rope gives
			let shake = 0;
			let invuln = 0;

			const body = { angle: 0, vel: 0 };
			const pointer = { x: 0, ready: false };
			const keys = { left: false, right: false };

			const notes = [];
			const sparks = [];
			const swell = [];
			// lane is a slot in the usable band, not a raw screen ratio — a short
			// window used to clamp two sirens onto the same pixel row
			const sirens = [
				{ side: -1, lane: 0.08, phase: 0.0 },
				{ side: 1, lane: 0.26, phase: 1.7 },
				{ side: -1, lane: 0.66, phase: 3.1 },
				{ side: 1, lane: 0.94, phase: 4.6 },
			];

			function clamp(v, lo, hi) {
				return v < lo ? lo : v > hi ? hi : v;
			}

			// ---------------------------------------------------------------- sprites

			// Assets are local to this folder (see ASSETS.md). Nothing here blocks:
			// every sprite falls back to the shape it replaced, so the piece still
			// runs if a file is missing or still decoding.
			function loadSprite(src) {
				const handle = { img: new Image(), ready: false };
				handle.img.onload = () => {
					handle.ready = handle.img.naturalWidth > 0;
				};
				handle.img.src = src;
				return handle;
			}

			const sirenSprite = loadSprite("assets/siren.webp");
			const SIREN_FOOT_X = 0.447; // the claws sit left of the sprite's centre
			const SIREN_SINK = 6; // press them into the rock lip

			// measured off the sprite: the flat shelf the claws land on
			const rockSprite = loadSprite("assets/rock-lip.webp");
			const ROCK_PERCH_X = 0.17;
			const ROCK_PERCH_Y = 0.016;

			function rockWidth() {
				return clamp(W * 0.26, 300, 460);
			}

			// How much cliff sits outboard of the perch. The perch is pulled in to at
			// most this, so the sprite's own outer edge always clears the frame and
			// nothing has to be patched in beside it.
			function rockOuter() {
				return ROCK_PERCH_X * rockWidth() - 12;
			}

			// Anchored on the mast, not the sprite's centre — they sit 5px apart and
			// the mast is what Odysseus is tied to. Deck is the top of the solid
			// hull, so the rail crosses his shins rather than his feet.
			const shipSprite = loadSprite("assets/ship.webp");
			const SHIP_MAST_X = 0.4971; // mast centre, across the sprite
			const SHIP_DECK_Y = 0.8411; // deck surface, down the sprite

			// Only the shape of a crest — the drift, spacing and respawn stay in
			// code, which is what keeps the sea moving.
			const waveSprite = loadSprite("assets/wave.webp");
			const WAVE_SLICES = [
				[0.0, 0.3088],
				[0.3416, 0.6579],
				[0.6922, 0.9995],
			];
			const WAVE_DIM = 0.3;

			// Cropped to its own content, so the bottom of the sprite is the far
			// water's edge — line that up with our waterline and the two seas meet.
			const backdropSprite = loadSprite("assets/backdrop.webp");
			const BACKDROP_DIM = 0.55; // it must not compete with the strait
			const BACKDROP_MIN_H = 0.45; // of viewport, so it never shrinks to a strip

			// Oar ports, measured off the hull: 16 of them, evenly spaced. The crew
			// sit at a few of these and the oars swing from all of them.
			const OAR_PORT_Y = 0.8954;
			const OAR_PORT_X0 = 0.1492;
			const OAR_PORT_STEP = 0.04677;
			const OAR_PORTS = [0, 2, 4, 6, 9, 11, 13, 15]; // every other one reads better
			const OAR_LEN = 0.24; // of hull height — long looms fought the waterline

			// Upper bodies only — the hull hides the waist cut, so the sheet never
			// had to draw legs. Oars are lines below, not part of the sprite.
			const crewSprite = loadSprite("assets/crew.webp");
			const CREW_SLICES = [
				[0.0, 0.2941],
				[0.2946, 0.4945],
				[0.5468, 0.7558],
				[0.7774, 0.9995],
			];
			// Spread along the hull rather than pinned to oar ports — the ports are
			// too far apart to seat a full bank. The gap in the middle is the mast.
			const CREW_XS = [0.15, 0.222, 0.294, 0.366, 0.438, 0.562, 0.634, 0.706, 0.778, 0.85];
			const CREW_SCALE = 0.34; // of Odysseus — they are seated and further off
			const CREW_DIM = 0.72; // held back so the pose changes do not catch the eye
			const CREW_SINK = 10; // how far the waist cut tucks under the hull
			const CREW_CYCLE = 2.0; // seconds for one stroke
			// The four poses run out and back rather than looping, so the stroke
			// reverses instead of snapping from finish to catch.
			const CREW_FRAMES = [0, 1, 2, 3, 2, 1];

			const odysseusSprite = loadSprite("assets/odysseus.webp");
			const ODY_SCALE = 1.16; // keeps the old silhouette's footprint
			const ODY_HEAD_FRAC = 0.932; // measured: head centre, up from the feet

			function odysseusH() {
				return bodyLen * ODY_SCALE;
			}

			// How far the head rides from the pivot. Notes are aimed at the arc this
			// sweeps, so difficulty follows the sprite instead of the old capsule.
			function headDist() {
				return odysseusSprite.ready ? odysseusH() * ODY_HEAD_FRAC : bodyLen;
			}

			function sirenSize() {
				const h = clamp(H * 0.15, 96, 150);
				const img = sirenSprite.img;
				const ratio = sirenSprite.ready ? img.naturalWidth / img.naturalHeight : 0.706;
				return { w: h * ratio, h };
			}

			// Measured off the sprite: the open mouth sits at 90.7% of its width and
			// 12.5% down. The song has to start there, not at the claws.
			const SIREN_MOUTH_X = 0.46; // from the perch, in sprite widths
			const SIREN_MOUTH_Y = 0.875; // above the perch, in sprite heights

			function sirenMouth(siren, at) {
				if (!sirenSprite.ready) return { x: at.x, y: at.y };
				const { w, h } = sirenSize();
				return {
					x: at.x - siren.side * SIREN_MOUTH_X * w,
					y: at.y + SIREN_SINK - SIREN_MOUTH_Y * h,
				};
			}

			function resize() {
				const dpr = Math.min(window.devicePixelRatio || 1, 2);
				W = window.innerWidth;
				H = window.innerHeight;
				canvas.width = Math.round(W * dpr);
				canvas.height = Math.round(H * dpr);
				ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
				deckY = H * 0.82;
				bodyLen = clamp(H * 0.19, 88, 175);
			}

			function sirenAt(siren) {
				// lane places the claws, but the body grows upward from there — the
				// whole sprite has to clear the shell's header, not just the perch.
				// The lower bound keeps them off the deck on short windows.
				const top = CHROME_PAD + sirenSize().h;
				const bottom = Math.max(top + 60, Math.min(H * 0.62, deckY - 80));
				const inset = rockSprite.ready ? Math.min(W * 0.06, rockOuter()) : W * 0.06;
				return {
					x: siren.side < 0 ? inset : W - inset,
					y: top + (bottom - top) * siren.lane,
				};
			}

			function headPos() {
				const d = headDist();
				return {
					x: W / 2 + Math.sin(body.angle) * d,
					y: deckY - Math.cos(body.angle) * d,
				};
			}

			function difficulty() {
				return clamp(elapsed / STRAIT_SECONDS, 0, 1);
			}

			// ---------------------------------------------------------------- notes

			function spawnNote() {
				const siren = sirens[Math.floor(Math.random() * sirens.length)];
				const from = sirenMouth(siren, sirenAt(siren));
				const head = headPos();

				// Aim across the arc the rope allows, never at the head itself.
				// Leaning away has to be an answer, so the spread runs wider
				// than the swing — some notes are already going to miss.
				const reach = Math.sin(MAX_LEAN) * headDist();
				const aimX = W / 2 + (Math.random() * 2 - 1) * reach * 1.6;
				const aimY = head.y + (Math.random() - 0.5) * H * 0.16;
				const dx = aimX - from.x;
				const dy = aimY - from.y;
				const dist = Math.hypot(dx, dy) || 1;
				const speed = (120 + Math.random() * 60) * (0.88 + difficulty() * 0.5);

				notes.push({
					x: from.x,
					y: from.y,
					vx: (dx / dist) * speed,
					vy: (dy / dist) * speed,
					r: 11 + Math.random() * 5,
					spin: (Math.random() - 0.5) * 1.6,
					tilt: (Math.random() - 0.5) * 0.7,
					wobble: Math.random() * TAU,
					wobbleAmp: 16 + Math.random() * 28,
					life: 0,
					kind: Math.random() < 0.4 ? 2 : 1,
				});
			}

			function drawNote(note) {
				const r = note.r;
				ctx.save();
				ctx.translate(note.x, note.y);
				ctx.rotate(note.tilt);
				ctx.fillStyle = GOLD;
				ctx.shadowColor = "rgba(232, 178, 76, 0.85)";
				ctx.shadowBlur = 16;

				ctx.beginPath();
				ctx.ellipse(0, 0, r * 0.62, r * 0.46, -0.35, 0, TAU);
				ctx.fill();

				ctx.fillRect(r * 0.42, -r * 2.3, r * 0.19, r * 2.3);

				ctx.beginPath();
				ctx.moveTo(r * 0.61, -r * 2.3);
				ctx.quadraticCurveTo(r * 1.7, -r * 1.85, r * 1.25, -r * 0.72);
				ctx.quadraticCurveTo(r * 1.42, -r * 1.6, r * 0.61, -r * 1.74);
				ctx.fill();

				if (note.kind === 2) {
					ctx.beginPath();
					ctx.moveTo(r * 0.61, -r * 1.62);
					ctx.quadraticCurveTo(r * 1.7, -r * 1.17, r * 1.25, -r * 0.04);
					ctx.quadraticCurveTo(r * 1.42, -r * 0.92, r * 0.61, -r * 1.06);
					ctx.fill();
				}

				ctx.restore();
			}

			function burst(x, y) {
				for (let i = 0; i < 16; i++) {
					const a = Math.random() * TAU;
					const sp = 40 + Math.random() * 170;
					sparks.push({
						x,
						y,
						vx: Math.cos(a) * sp,
						vy: Math.sin(a) * sp,
						life: 0,
						max: 0.45 + Math.random() * 0.5,
					});
				}
			}

			// ---------------------------------------------------------------- update

			function update(dt) {
				time += dt;

				for (let i = swell.length - 1; i >= 0; i--) {
					swell[i].x -= swell[i].speed * dt;
					if (swell[i].x < -W * 0.6) swell.splice(i, 1);
				}
				if (swell.length < 14 && Math.random() < dt * 9) {
					swell.push({
						x: W + Math.random() * W * 0.4,
						y: deckY + 20 + Math.random() * (H - deckY),
						len: 60 + Math.random() * 190,
						speed: 60 + Math.random() * 120,
						kind: Math.floor(Math.random() * WAVE_SLICES.length),
					});
				}

				if (phase === "run") {
					elapsed += dt;

					let target = 0;
					if (keys.left || keys.right) {
						target = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
					} else if (pointer.ready) {
						target = clamp((pointer.x - W / 2) / (W * 0.34), -1, 1);
					}

					body.vel += (target * MAX_LEAN - body.angle) * LEAN_PUSH * dt;
					body.vel -= body.angle * ROPE_PULL * dt;
					body.vel *= Math.pow(LEAN_DAMP, dt * 60);
					body.angle += body.vel * dt;

					// the rope simply will not give any further
					if (body.angle > MAX_LEAN) {
						body.angle = MAX_LEAN;
						body.vel *= -0.18;
					} else if (body.angle < -MAX_LEAN) {
						body.angle = -MAX_LEAN;
						body.vel *= -0.18;
					}

					const rate = 1.25 + difficulty() * 2.4;
					if (Math.random() < dt * rate) spawnNote();

					charm = clamp(charm - dt * 0.14, 0, 1);

					if (elapsed >= STRAIT_SECONDS) {
						phase = "passed";
						say("해협을 지났다. 노래는 아직 귓속에 있다.");
					}
				}

				const head = headPos();
				for (let i = notes.length - 1; i >= 0; i--) {
					const note = notes[i];
					note.life += dt;
					note.wobble += dt * 2.4;
					note.x += note.vx * dt;
					note.y += (note.vy + Math.cos(note.wobble) * note.wobbleAmp) * dt;
					note.tilt += note.spin * dt;

					if (
						phase === "run" &&
						invuln <= 0 &&
						// only the note's ink counts, not its stem and flag
						Math.hypot(note.x - head.x, note.y - head.y) < note.r * 0.45 + HEAD_HIT
					) {
						burst(note.x, note.y);
						notes.splice(i, 1);
						charm = clamp(charm + HIT_CHARM, 0, 1);
						shake = 12;
						invuln = HIT_MERCY;
						body.vel += (note.vx > 0 ? 1 : -1) * 0.35;
						if (charm >= 1) {
							phase = "lost";
							say("밧줄이 풀렸다.");
						}
						continue;
					}

					if (
						note.life > 9 ||
						note.x < -120 ||
						note.x > W + 120 ||
						note.y < -160 ||
						note.y > H + 160
					) {
						notes.splice(i, 1);
					}
				}

				for (let i = sparks.length - 1; i >= 0; i--) {
					const s = sparks[i];
					s.life += dt;
					s.x += s.vx * dt;
					s.y += s.vy * dt;
					s.vy += 190 * dt;
					if (s.life >= s.max) sparks.splice(i, 1);
				}

				shake = Math.max(0, shake - dt * 40);
				invuln = Math.max(0, invuln - dt);
			}

			// ------------------------------------------------------------------ draw

			function drawSky() {
				const sky = ctx.createLinearGradient(0, 0, 0, H);
				sky.addColorStop(0, "#0a1024");
				sky.addColorStop(0.55, "#111d3a");
				sky.addColorStop(1, "#060a16");
				ctx.fillStyle = sky;
				ctx.fillRect(0, 0, W, H);
			}

			// Cover-fit on width, but never so short that it reads as a band. Sits
			// on the waterline rather than the frame, so the horizon stays put as
			// the window changes shape.
			function drawBackdrop() {
				if (!backdropSprite.ready) return;

				const img = backdropSprite.img;
				const scale = Math.max(
					W / img.naturalWidth,
					(H * BACKDROP_MIN_H) / img.naturalHeight,
				);
				const w = img.naturalWidth * scale;
				const h = img.naturalHeight * scale;

				ctx.save();
				ctx.globalAlpha = BACKDROP_DIM;
				ctx.drawImage(img, (W - w) / 2, deckY - 30 - h, w, h);
				ctx.restore();
			}

			// Drawn after the cliffs, so their bases sink into the water instead of
			// ending on a hard edge.
			function drawWater() {
				ctx.fillStyle = "#0b1730";
				ctx.beginPath();
				ctx.moveTo(0, deckY - 30);
				for (let x = 0; x <= W; x += 24) {
					ctx.lineTo(x, deckY - 30 + Math.sin(x * 0.012 + time * 0.9) * 7);
				}
				ctx.lineTo(W, H);
				ctx.lineTo(0, H);
				ctx.closePath();
				ctx.fill();

				if (waveSprite.ready) {
					const img = waveSprite.img;
					ctx.save();
					ctx.globalAlpha = WAVE_DIM;
					for (const s of swell) {
						const [from, to] = WAVE_SLICES[s.kind % WAVE_SLICES.length];
						const sx = from * img.naturalWidth;
						const sWidth = (to - from) * img.naturalWidth;
						const h = s.len * (img.naturalHeight / sWidth);
						ctx.drawImage(img, sx, 0, sWidth, img.naturalHeight, s.x, s.y - h / 2, s.len, h);
					}
					ctx.restore();
					return;
				}

				ctx.strokeStyle = "rgba(150, 190, 235, 0.16)";
				ctx.lineWidth = 2;
				for (const s of swell) {
					ctx.beginPath();
					ctx.moveTo(s.x, s.y);
					ctx.lineTo(s.x + s.len, s.y);
					ctx.stroke();
				}
			}

			function placedSirens() {
				return sirens.map((siren) => ({ siren, at: sirenAt(siren) }));
			}

			// Each cliff runs from its own lip to the bottom of the frame, so drawing
			// siren-by-siren let a later rock bury an earlier siren. Rocks go down in
			// one pass, back to front, and the figures follow in another.
			function drawRocks() {
				const rock = rockSprite.ready ? rockSprite.img : null;
				const rw = rockWidth();
				const rh = rock ? rw * (rock.naturalHeight / rock.naturalWidth) : 0;

				ctx.fillStyle = '#05080f';
				for (const { siren, at } of placedSirens().sort((a, b) => a.at.y - b.at.y)) {
					if (!rock) {
						ctx.beginPath();
						ctx.moveTo(at.x - siren.side * 96, H);
						ctx.lineTo(at.x - siren.side * 62, at.y + 74);
						ctx.lineTo(at.x - siren.side * 26, at.y + 12);
						ctx.lineTo(at.x + siren.side * 58, at.y - 34);
						ctx.lineTo(at.x + siren.side * 120, H);
						ctx.closePath();
						ctx.fill();
						continue;
					}

					ctx.save();
					ctx.translate(at.x, at.y);
					if (siren.side > 0) ctx.scale(-1, 1); // the far cliff mirrors

					const left = -ROCK_PERCH_X * rw;
					const top = -ROCK_PERCH_Y * rh;
					const floor = H - at.y;

					// The sprite is only the lip. Carry the cliff below it as a taper
					// rather than a block — the outer edge is already off-frame, and the
					// water is painted afterwards, so the base never shows a seam.
					ctx.beginPath();
					ctx.moveTo(left, top + rh - 1);
					ctx.lineTo(left + rw, top + rh - 1);
					ctx.lineTo(left + rw - rw * 0.26, floor);
					ctx.lineTo(left, floor);
					ctx.closePath();
					ctx.fill();

					ctx.drawImage(rock, left, top, rw, rh);
					ctx.restore();
				}
			}

			function drawSirenFigures() {
				const { w, h } = sirenSize();
				for (const { siren, at } of placedSirens()) {
					ctx.save();
					ctx.shadowColor = 'rgba(232, 178, 76, 0.5)';
					ctx.shadowBlur = 26;

					if (sirenSprite.ready) {
						ctx.translate(at.x, at.y + SIREN_SINK);
						// the sprite faces right; the far rock has to look back inland
						if (siren.side > 0) ctx.scale(-1, 1);
						ctx.drawImage(sirenSprite.img, -SIREN_FOOT_X * w, -h, w, h);
					} else {
						ctx.fillStyle = GOLD;
						ctx.globalAlpha = 0.8;
						ctx.beginPath();
						ctx.arc(at.x, at.y, 8, 0, TAU);
						ctx.fill();
					}

					ctx.restore();
				}
			}

			// Last of the scenery, so neither cliff nor singer can swallow the song.
			function drawSongRings() {
				ctx.save();
				ctx.strokeStyle = GOLD;
				ctx.lineWidth = 1.5;
				for (const { siren, at } of placedSirens()) {
					const mouth = sirenMouth(siren, at);
					const pulse = (time * 0.55 + siren.phase) % 2.4;
					for (let k = 0; k < 3; k++) {
						const t = (pulse + k * 0.8) % 2.4;
						ctx.globalAlpha = Math.max(0, 0.3 - t * 0.115);
						ctx.beginPath();
						ctx.arc(mouth.x, mouth.y, t * 105, 0, TAU);
						ctx.stroke();
					}
				}
				ctx.restore();
			}

			// One number drives the whole ship. Every part is a fraction of it, so
			// width and height always scale by the same factor — which is what lets
			// a fixed-aspect ship.webp drop in later without distorting. The cap on
			// W only keeps the hull from running off a narrow window; it never
			// stretches one axis on its own.
			function shipWidth() {
				return Math.min(clamp(H * 1.25, 560, 1200), W * 1.06);
			}

			// Where the hull sits this frame. Crew and oars hang off the same numbers
			// so they never drift apart from the ship.
			function shipLayout() {
				const sw = shipWidth();
				const img = shipSprite.img;
				const sh = shipSprite.ready ? sw * (img.naturalHeight / img.naturalWidth) : 0;
				return { sw, sh, left: W / 2 - SHIP_MAST_X * sw, top: deckY - SHIP_DECK_Y * sh };
			}

			function portX(i, sw, left) {
				return left + (OAR_PORT_X0 + i * OAR_PORT_STEP) * sw;
			}

			function drawCrew() {
				if (!crewSprite.ready || !shipSprite.ready) return;

				const img = crewSprite.img;
				const { sw, left } = shipLayout();
				const h = odysseusH() * CREW_SCALE;

				ctx.save();
				ctx.globalAlpha = CREW_DIM;
				CREW_XS.forEach((at, i) => {
					// each rower is offset in the cycle, so the bank rows in sequence
					const phase = (time / CREW_CYCLE + i / CREW_XS.length) % 1;
					const step = Math.floor(phase * CREW_FRAMES.length) % CREW_FRAMES.length;
					const [from, to] = CREW_SLICES[CREW_FRAMES[step]];
					const sx = from * img.naturalWidth;
					const sWidth = (to - from) * img.naturalWidth;
					const w = h * (sWidth / img.naturalHeight);
					ctx.drawImage(
						img,
						sx,
						0,
						sWidth,
						img.naturalHeight,
						left + at * sw - w / 2,
						deckY + CREW_SINK - h,
						w,
						h,
					);
				});
				ctx.restore();
			}

			// In front of the hull: on the near side the looms pass outside it.
			function drawOars() {
				if (!shipSprite.ready) return;

				const { sw, sh, left, top } = shipLayout();
				const len = sh * OAR_LEN;
				const py = top + OAR_PORT_Y * sh;

				ctx.save();
				ctx.strokeStyle = "#2a1e0d";
				ctx.lineWidth = Math.max(2, sw * 0.004);
				ctx.lineCap = "round";
				OAR_PORTS.forEach((port, i) => {
					// same period as the rowers, staggered the same way
					const a = 0.4 + Math.sin((time / CREW_CYCLE) * TAU + i * 0.55) * 0.22;
					const px = portX(port, sw, left);
					ctx.beginPath();
					ctx.moveTo(px, py);
					ctx.lineTo(px + Math.sin(a) * len, py + Math.cos(a) * len);
					ctx.stroke();
				});
				ctx.restore();
			}

			function drawShip() {
				const cx = W / 2;
				const sw = shipWidth();

				if (shipSprite.ready) {
					const { sh, left, top } = shipLayout();
					ctx.drawImage(shipSprite.img, left, top, sw, sh);
					return;
				}

				const half = sw / 2;
				const mastW = Math.max(10, sw * 0.011);
				const mastH = bodyLen * 2.05;

				ctx.fillStyle = "#141d33";
				ctx.globalAlpha = 0.9;
				ctx.beginPath();
				ctx.moveTo(cx + mastW / 2, deckY - bodyLen * 1.9);
				ctx.lineTo(cx + mastW / 2, deckY - bodyLen * 0.42);
				ctx.lineTo(cx + sw * 0.33, deckY - bodyLen * 1.05);
				ctx.closePath();
				ctx.fill();
				ctx.globalAlpha = 1;

				ctx.fillStyle = "#2a1e0d";
				ctx.fillRect(cx - mastW / 2, deckY - mastH, mastW, mastH);

				ctx.fillStyle = "#1c1409";
				ctx.beginPath();
				ctx.moveTo(cx - half, deckY);
				ctx.lineTo(cx + half, deckY);
				ctx.lineTo(cx + half * 0.8, deckY + sw * 0.045);
				ctx.lineTo(cx - half * 0.8, deckY + sw * 0.045);
				ctx.closePath();
				ctx.fill();
			}

			function drawOdysseus() {
				const cx = W / 2;
				ctx.save();
				ctx.translate(cx, deckY);
				ctx.rotate(body.angle);
				if (invuln > 0) ctx.globalAlpha = 0.45 + Math.abs(Math.sin(time * 22)) * 0.55;

				if (odysseusSprite.ready) {
					const img = odysseusSprite.img;
					const h = odysseusH();
					const w = h * (img.naturalWidth / img.naturalHeight);
					// the sprite was cropped so its feet land dead centre
					ctx.drawImage(img, -w / 2, -h, w, h);
				} else {
					ctx.fillStyle = "#c8b48a";
					ctx.beginPath();
					ctx.roundRect(-13, -bodyLen, 26, bodyLen, 13);
					ctx.fill();

					ctx.fillStyle = "#d8c49a";
					ctx.beginPath();
					ctx.arc(0, -bodyLen - 13, 15, 0, TAU);
					ctx.fill();

					// the rope, three turns
					ctx.strokeStyle = "#8c6b3a";
					ctx.lineWidth = 5;
					for (let i = 1; i <= 3; i++) {
						const y = -bodyLen * (i / 4);
						ctx.beginPath();
						ctx.moveTo(-17, y);
						ctx.lineTo(17, y);
						ctx.stroke();
					}
				}

				ctx.restore();
			}

			function drawSparks() {
				for (const s of sparks) {
					const a = 1 - s.life / s.max;
					ctx.globalAlpha = a * 0.9;
					ctx.fillStyle = GOLD;
					ctx.beginPath();
					ctx.arc(s.x, s.y, 2.6 * a + 0.6, 0, TAU);
					ctx.fill();
				}
				ctx.globalAlpha = 1;
			}

			function drawCharm() {
				if (charm <= 0.001) return;
				const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.24, W / 2, H / 2, H * 0.78);
				g.addColorStop(0, "rgba(232, 178, 76, 0)");
				g.addColorStop(1, `rgba(232, 178, 76, ${0.46 * charm})`);
				ctx.fillStyle = g;
				ctx.fillRect(0, 0, W, H);
			}

			function drawHud() {
				const pad = clamp(W * 0.06, 20, 84);
				const barW = Math.min(W - pad * 2, 460);
				const x = (W - barW) / 2;
				const y = H - 46;

				ctx.fillStyle = "rgba(255, 255, 255, 0.14)";
				ctx.fillRect(x, y, barW, 3);
				ctx.fillStyle = "rgba(216, 196, 154, 0.85)";
				ctx.fillRect(x, y, barW * difficulty(), 3);

				ctx.fillStyle = "rgba(255, 255, 255, 0.12)";
				ctx.fillRect(x, y + 14, barW, 3);
				ctx.fillStyle = GOLD;
				ctx.fillRect(x, y + 14, barW * charm, 3);

				ctx.font = '400 11px "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
				ctx.fillStyle = "rgba(232, 215, 174, 0.6)";
				ctx.textAlign = "left";
				ctx.fillText("해협", x, y - 9);
				ctx.textAlign = "right";
				ctx.fillText("홀림", x + barW, y - 9);
				ctx.textAlign = "left";
			}

			function draw() {
				ctx.save();
				if (shake > 0.2) {
					ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
				}

				// order matters: the cliffs go down before the water so their bases
				// sink into it, and the song goes down after the singers so nothing
				// in the scenery can swallow it
				drawSky();
				drawBackdrop();
				drawRocks();
				drawWater();
				drawSirenFigures();
				drawSongRings();
				drawCrew(); // behind the hull, which crops their waists for us
				drawShip();
				drawOars();
				drawOdysseus();
				for (const note of notes) drawNote(note);
				drawSparks();

				ctx.restore();

				drawCharm();
				drawHud();
			}

			// ----------------------------------------------------------------- shell

			function say(text) {
				captionEl.textContent = text;
				captionEl.classList.add("is-on");
			}

			function hush() {
				captionEl.classList.remove("is-on");
			}

			function start() {
				phase = "run";
				elapsed = 0;
				charm = 0;
				shake = 0;
				invuln = 0;
				body.angle = 0;
				body.vel = 0;
				notes.length = 0;
				sparks.length = 0;
				hush();
			}

			function nudge() {
				if (phase === "run") return;
				start();
			}

			function frame(now) {
				const dt = Math.min((now - last) / 1000 || 0, 1 / 20);
				last = now;
				update(dt);
				draw();
				requestAnimationFrame(frame);
			}

			window.addEventListener("resize", resize);
			window.addEventListener("pointermove", (e) => {
				pointer.x = e.clientX;
				pointer.ready = true;
			});
			window.addEventListener("pointerdown", (e) => {
				pointer.x = e.clientX;
				pointer.ready = true;
				nudge();
			});
			window.addEventListener("keydown", (e) => {
				if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
				if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
				if (e.key === " " || e.key === "Enter") {
					e.preventDefault();
					nudge();
				}
			});
			window.addEventListener("keyup", (e) => {
				if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
				if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
			});

			resize();
			say("좌우로 기울여 음표를 피하세요 — 밧줄은 여기까지만 허락합니다");
			requestAnimationFrame((t) => {
				last = t;
				requestAnimationFrame(frame);
			});
		</script>
