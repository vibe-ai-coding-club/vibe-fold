title: 오늘의 말씀
creator: anveloper
description: |
  번아웃과 읽씹의 시대에 내려온 말씀 열네 편입니다. 흩뿌려진 카드에서 세 장을 고르면, 그 자리에서 뒤집혀 한 줄씩 떠오릅니다.

  어느 카드에 어느 말씀이 들었는지는 들어올 때마다 섞입니다. 같은 세 장이 두 번 나오기는 어렵습니다.
# 가로 3:2 ~ 16:10. 세로를 넣으면 카드에서 위아래가 잘립니다.
